name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter test

      # GitHub Pages は https://<user>.github.io/<repo>/ で配信されるため base-href にリポジトリ名を指定する
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # App Store 等で参照しているプライバシーポリシー/サポートページを従来と同じURLで配信し続ける
      - run: cp privacy_policy.html support.html build/web/

      # SPA のため、存在しないパスへの直接アクセス時も index.html を返す
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
